<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Curso de Idiomas</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <h1>Curso Poliglota</h1>
    <div class="Box">
        <p>Aprenda um novo idioma </p>

        <form action="#" method="POST">

            <div class="form-control">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required />
            </div>

            <div class="form-control">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required />
            </div>

            <div class="form-control">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required />
            </div>

            <div class="form-control">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>

            <div class="form-control">
                <label for="idioma">Qual idioma deseja aprender?</label>
                <select id="idioma" name="idioma" required>
                    <option value=""></option>
                    <option value="ingles">Inglês</option>
                    <option value="espanhol">Espanhol</option>
                    <option value="frances">Francês</option>
                    <option value="alemao">Alemão</option>
                </select>
            </div>

            <<div class="form-control"> <label for="senha">Crie uma Senha</label> <input type="password" id="senha"
                    name="senha" required>
    </div>
    <div class="form-control"> <button type="submit" class="btn-cadastro">Cadastrar</button> </div>
    </form>
</body>

</html>
